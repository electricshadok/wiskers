seed: 0

data_module:
  _target_: wiskers.datasets.gym.breakout.BreakoutDataModule
  # Replay buffer configuration
  capacity: 1000
  chunk_len: 50
  # Environment rollout configuration
  seed_episodes: 20
  max_steps_per_episode: 500
  image_size: [64, 64]
  policy: heuristic
  epsilon: 0.1
  # DataLoader / Training schedule
  batch_size: 16
  steps_per_epoch: 500
  # General settings
  seed: ${seed}
  verbose: true
