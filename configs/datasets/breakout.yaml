seed: 0

data_module:
  _target_: wiskers.datasets.gym.breakout.BreakoutDataModule
  # Replay buffer configuration (stores complete rollout episodes)
  replay_buffer:
    _target_: wiskers.datasets.trajectories.replay_buffer.ReplayBuffer
    capacity_episodes: 1000  # Number of complete episodes to store
  # Pluggable sampler configuration
  sampler:
    _target_: wiskers.datasets.trajectories.sampler.UniformChunkSampler
    chunk_len: 50
  # Environment rollout configuration
  seed_episodes: 20
  max_steps_per_episode: 500
  image_size: [64, 64]
  policy:
    _target_: wiskers.datasets.gym.breakout_policies.BreakoutHeuristicPolicy
    epsilon: 0.1
  # DataLoader / Training schedule
  batch_size: 16
  steps_per_epoch: 500
  # General settings
  seed: ${seed}
  verbose: true
