seed: 0

data_module:
  _target_: wiskers.datasets.gym.car_racing.CarRacingDataModule
  # Replay buffer configuration
  replay_buffer:
    _target_: wiskers.datasets.trajectories.replay_buffer.ReplayBuffer
    capacity: 1000
    chunk_len: 50
  # Environment rollout configuration
  seed_episodes: 20
  max_steps_per_episode: 500
  policy:
    _target_: wiskers.datasets.gym.car_racing_policies.CarRacingHeuristicPolicy
  # DataLoader / Training schedule
  batch_size: 16
  steps_per_epoch: 500
  # General settings
  seed: ${seed}
  verbose: true
