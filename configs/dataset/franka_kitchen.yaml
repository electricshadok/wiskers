seed: 0

# Shared transform for both Collector (policy input) and TrajectoryDataModule (training batches)
transform:
  _target_: wiskers.data.transforms.EpisodeToTensor
  image_size: [3, 64, 64]  # [C, H, W] (C = 1 for grayscale or 3 for RGB)
  obs_range: [0.0, 1.0]    # [low, high] normalization range for observations

data_module:
  _target_: wiskers.data.datamodule.TrajectoryDataModule

  # Rollout data collection settings
  collector:
    _target_: wiskers.data.collector.Collector
    env:
      _target_: wiskers.envs.franka_kitchen.env.FrankaKitchenEnv
      tasks_to_complete:
        - microwave
      physics:
        _target_: wiskers.envs.mujoco_env.MujocoPhysics
        gravity: null
        timestep: null
        friction_scale: null
        mass_scale: null
        damping_scale: null
      # Optional per-field observation transforms (null = keep raw contiguous torch.Tensor)
      obs_fields:
        render:
          _target_: wiskers.envs.utils.ResizeUint8
          size: [64, 64]
        "state:robot_qpos": null
        "state:robot_qvel": null
        "state:obj_qpos": null
        "state:obj_qvel": null
    controller:
      _target_: wiskers.envs.franka_kitchen.policies.FrankaKitchenHeuristicPolicy
      momentum: 0.85
      noise_scale: 0.25
    transform: ${transform}
    num_episodes: 20
    min_steps: ${data_module.sampler.num_steps}
    max_steps: 250
    seed: ${seed}
    verbose: true

  # Replay buffer that stores complete episode trajectories in memory
  replay_buffer:
    _target_: wiskers.data.buffer.ReplayBuffer
    capacity_episodes: 500  # Maximum number of complete episodes to keep in memory
    device: cpu

  # Sampler that extracts sequence chunks from episodes for training batches
  sampler:
    _target_: wiskers.data.sampler.UniformChunkSampler
    num_steps: 50  # Consecutive steps per sampled chunk (must be <= collector.min_steps)

  # Transform that converts a sampled Episode chunk into PyTorch tensors
  transform: ${transform}

  # DataLoader settings
  batch_size: 16
  num_workers: 2
