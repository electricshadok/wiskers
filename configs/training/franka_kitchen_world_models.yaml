# Composition of dataset, model, and training configuration
defaults:
  - dataset: franka_kitchen
  - module: world_models
  - _self_

# Franka Kitchen continuous control action dimension override (9-DoF)
module:
  mdn_rnn:
    action_size: 9

# Logger Configs
tensor_board_logger:
  save_dir: "./experiments"
  name: "world_models"
  version: null

# Export model
export_onnx: False
export_safetensors: False

# Training Configs
earlystopping: False

# lightning.Trainer Config
trainer:
  limit_train_batches: 1.0
  limit_test_batches: 1.0
  limit_val_batches: 1.0
  max_epochs: 100
  log_every_n_steps: 10
