# Composition of dataset, model, and training configuration
defaults:
  - configs/datasets/carracing.yaml
  - configs/modules/world_models.yaml

# Logger Configs
tensor_board_logger:
  save_dir: "./experiments"
  name: "world_models"
  version: null

# Export model
export_onnx: False
export_safetensors: False

# Training Configs
earlystopping: False

# lightning.Trainer Config
trainer:
  limit_train_batches: 1.0
  limit_test_batches: 1.0
  limit_val_batches: 1.0
  max_epochs: 100
  log_every_n_steps: 10
