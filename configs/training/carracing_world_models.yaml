# Global seed
seed: 0

# Shared transform for both Collector (policy input) and TrajectoryDataModule (training batches)
transform:
  _target_: wiskers.datasets.trajectories.transforms.EpisodeToTensor
  image_size: [3, 64, 64]  # [C, H, W] (C = 1 for grayscale or 3 for RGB)
  obs_range: [0.0, 1.0]    # [low, high] normalization range for observations

# Datamodule Config (same as configs/datasets/carracing.yaml)
data_module:
  _target_: wiskers.datasets.trajectories.datamodule.TrajectoryDataModule

  # Replay buffer that stores complete episode trajectories in memory
  replay_buffer:
    _target_: wiskers.datasets.trajectories.buffer.ReplayBuffer
    capacity_episodes: 1000  # Maximum number of complete episodes to keep in memory

  # Sampler that extracts sequence chunks from episodes for training batches
  sampler:
    _target_: wiskers.datasets.trajectories.sampler.UniformChunkSampler
    num_steps: 50  # Number of consecutive steps per sampled chunk

  # Transform that converts a sampled Episode chunk into PyTorch tensors
  transform: ${transform}

  # Rollout data collection settings
  collector:
    _target_: wiskers.datasets.trajectories.collector.Collector
    env:
      _target_: wiskers.envs.TorchGymEnv
      env:
        _target_: wiskers.envs.car_racing.make_car_racing_env
        image_size: [64, 64]
        show_indicators: false
    policy:
      _target_: wiskers.envs.car_racing.CarRacingHeuristicPolicy
    transform: ${transform}
    num_episodes: 20
    min_steps: 50
    max_steps: 500
    seed: ${seed}
    verbose: true

  # DataLoader batch size
  batch_size: 16

# Logger Configs
tensor_board_logger:
  save_dir: "./experiments"
  name: "world_models"
  version: null

# Export model
export_onnx: False
export_safetensors: False

# Module Config (wiskers/world_models.py)
module:
  _target_: wiskers.world_models.WorldModels

  # V model (frozen): [N, 3, 64, 64] -> z [N, 32]
  encoder:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: wiskers.models.world_models.encoder_decoder.CNNEncoder
        in_channels: 3
        block_channels: [32, 64, 128, 256]
        block_attentions: [False, False, False, False]
      - _target_: torch.nn.Flatten
      - _target_: torch.nn.Linear
        in_features: 4096  # 256 * 4 * 4
        out_features: ${module.mdn_rnn.latent_size}
  # z [N, 32] -> [N, 3, 64, 64]
  decoder:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: torch.nn.Linear
        in_features: ${module.mdn_rnn.latent_size}
        out_features: 4096  # 256 * 4 * 4
      - _target_: torch.nn.Unflatten
        dim: 1
        unflattened_size: [256, 4, 4]
      - _target_: wiskers.models.world_models.encoder_decoder.CNNDecoder
        out_channels: 3
        stem_channels: 256
        block_channels: [256, 128, 64, 32]
        block_attentions: [False, False, False, False]

  # M model (trained)
  mdn_rnn:
    _target_: wiskers.models.world_models.mdn_rnn.MDNRNN
    latent_size: 32
    action_size: 3  # CarRacing: [steer, gas, brake]
    hidden_size: 256
    num_gaussians: 5

  # C model (not trained here)
  controller:
    _target_: wiskers.models.world_models.controller.Controller
    latent_size: ${module.mdn_rnn.latent_size}
    hidden_size: ${module.mdn_rnn.hidden_size}
    action_size: ${module.mdn_rnn.action_size}

  # Optimizer Configuration
  learning_rate: 1e-3

# Training Configs
earlystopping: False

# lightning.Trainer Config
trainer:
  limit_train_batches: 1.0
  limit_test_batches: 1.0
  limit_val_batches: 1.0
  max_epochs: 100
  log_every_n_steps: 10

