[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wiskers"
version = "0.1.0"
description = "World Models and Policy Learning Playground"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "lightning>=2.4.0",
    "tensordict>=0.7.0,<0.8.0",
    "gymnasium[box2d]>=1.0.0",
    "gymnasium-robotics>=1.4.2",
    "mujoco>=3.1.0",
    "numpy",
    "omegaconf",
    "hydra-core",
    "safetensors",
    "tensorboard",
    "streamlit",
    "scikit-learn",
    "matplotlib",
    "onnx",
    "onnxruntime",
    "swig",
    "ale-py",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pyrefly",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wiskers*"]

[tool.ruff]
line-length = 120
indent-width = 4
exclude = [
    "archive",
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I"
]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []


[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["wiskers"]


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.pyrefly]
preset = "basic"
project-includes = ["."]
project-excludes = [
    "archive/**",
    "**/.venv/**",
]
use-ignore-files = true
